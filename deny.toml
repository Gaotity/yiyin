[graph]
all-features = true
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
]

[advisories]
version = 2
unmaintained = "all"
unused-ignored-advisory = "deny"
ignore = [
  { id = "RUSTSEC-2025-0075", reason = "Tauri 2.11.5 transitively uses the unmaintained unic range crate and has no safe upgrade path." },
  { id = "RUSTSEC-2025-0080", reason = "Tauri 2.11.5 transitively uses the unmaintained unic common crate and has no safe upgrade path." },
  { id = "RUSTSEC-2025-0081", reason = "Tauri 2.11.5 transitively uses the unmaintained unic property crate and has no safe upgrade path." },
  { id = "RUSTSEC-2025-0098", reason = "Tauri 2.11.5 transitively uses the unmaintained unic version crate and has no safe upgrade path." },
  { id = "RUSTSEC-2025-0100", reason = "Tauri 2.11.5 transitively uses the unmaintained unic identifier crate and has no safe upgrade path." },
  { id = "RUSTSEC-2026-0192", reason = "cosmic-text 0.19.0 transitively uses ttf-parser and no safe compatible upgrade exists." },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[bans.workspace-dependencies]
duplicates = "deny"
include-path-dependencies = true
unused = "deny"

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "MPL-2.0",
  "GPL-3.0-only",
  "Unicode-3.0",
  "Zlib",
]

[sources]
unknown-git = "deny"
unknown-registry = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
