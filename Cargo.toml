[workspace]
members = [
  "crates/yiyin-domain",
  "crates/yiyin-application",
  "crates/yiyin-infrastructure",
  "src-tauri",
]
resolver = "2"

[workspace.package]
version = "1.6.0"
edition = "2024"
rust-version = "1.97.0"
license = "GPL-3.0-only"

[workspace.dependencies]
yiyin-domain = { path = "crates/yiyin-domain" }
yiyin-application = { path = "crates/yiyin-application" }
yiyin-infrastructure = { path = "crates/yiyin-infrastructure" }

tauri = "=2.11.5"
tauri-build = "=2.6.3"
tauri-plugin-dialog = "=2.7.1"
tauri-plugin-log = "=2.9.0"
tauri-plugin-opener = "=2.5.4"
tauri-plugin-single-instance = "=2.4.2"
log = "=0.4.33"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
thiserror = "=2.0.18"
tokio = { version = "=1.53.1", features = ["fs", "rt-multi-thread", "sync", "time"] }
uuid = { version = "=1.23.5", features = ["v4"] }
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
kamadak-exif = "=0.6.1"
cosmic-text = "=0.19.0"
ts-rs = "=12.0.1"
tempfile = "=3.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
