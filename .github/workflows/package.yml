name: Native packages

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 24.x
  PNPM_VERSION: 11.13.0
  RUST_TOOLCHAIN: 1.97.0
  CARGO_DENY_VERSION: 0.20.2

jobs:
  native-changes:
    name: Detect native package changes
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.changes.outputs.should_run }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - name: Detect native package inputs
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          should_run=false
          changed_files="$RUNNER_TEMP/native-changed-files"
          git diff --name-only -z "$BASE_SHA...$HEAD_SHA" > "$changed_files"
          while IFS= read -r -d '' path; do
            case "$path" in
              *.md|docs/*)
                ;;
              src/*|src-tauri/*|crates/*|assets/*|icon/*|tests/fixtures/*|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|Cargo.toml|Cargo.lock|rust-toolchain.toml|index.html|vite.config.mjs|tsconfig.json|scripts/verify-bundle.mjs|scripts/w3c-smoke.mjs|.github/workflows/package.yml)
                should_run=true
                break
                ;;
            esac
          done < "$changed_files"

          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"

  macos-package-smoke:
    name: macOS package smoke
    needs: native-changes
    if: ${{ !cancelled() && (needs['native-changes'].result != 'success' || needs['native-changes'].outputs.should_run == 'true') }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.13.0 --activate
      - name: Install pinned Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build unsigned package
        run: pnpm tauri build --bundles app,dmg
      - name: Verify package contents
        run: pnpm verify:bundle -- --platform macos --artifact "target/release/bundle/macos/壹印.app"
      - name: Launch smoke
        run: |
          executable="$(find "target/release/bundle/macos/壹印.app/Contents/MacOS" -type f -perm +111 | head -n 1)"
          "$executable" &
          app_pid=$!
          sleep 5
          kill -0 "$app_pid"
          kill "$app_pid"
          wait "$app_pid" || true
      - name: Upload unsigned macOS packages
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: yiyin-macos-unsigned
          path: |
            target/release/bundle/macos
            target/release/bundle/dmg
          retention-days: 7

  windows-package-and-desktop-smoke:
    name: Windows package and desktop smoke
    needs: native-changes
    if: ${{ !cancelled() && (needs['native-changes'].result != 'success' || needs['native-changes'].outputs.should_run == 'true') }}
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.13.0 --activate
      - name: Install pinned Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build unsigned production package
        run: pnpm tauri build --bundles nsis
      - name: Verify production package contents
        run: pnpm verify:bundle -- --platform windows --artifact target/release/bundle
      - name: Build compile-time fixture binary
        env:
          TAURI_CONFIG: '{"app":{"windows":[{"label":"main","title":"壹印","width":900,"height":730,"minWidth":900,"minHeight":730,"maxWidth":900,"maxHeight":730,"resizable":false,"decorations":false,"devtools":false,"additionalBrowserArgs":"--remote-debugging-port=9222"}]}}'
        run: cargo build -p yiyin-desktop --release --locked --features e2e-fixture,tauri/custom-protocol
      - name: Prepare one CI fixture
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\yiyin-e2e-fixtures"
          Copy-Item "tests\fixtures\input\portrait-default.png" "$env:RUNNER_TEMP\yiyin-e2e-fixtures\portrait-default.png"
      - name: Desktop W3C smoke
        shell: bash
        env:
          YIYIN_E2E_FIXTURE_DIR: ${{ runner.temp }}\yiyin-e2e-fixtures
        run: |
          echo "== runtime versions =="
          msedgedriver.exe --version || true
          powershell.exe -NoProfile -Command "(Get-Item 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe').VersionInfo.ProductVersion" || true
          echo "== start msedgedriver =="
          msedgedriver.exe --port=4444 --verbose --log-path="$RUNNER_TEMP/msedgedriver.log" &
          driver_pid=$!
          echo "$driver_pid" > "$RUNNER_TEMP/msedgedriver.pid"
          driver_ready=false
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4444/status > /dev/null 2>&1; then
              driver_ready=true
              break
            fi
            sleep 1
          done
          if [ "$driver_ready" != true ]; then
            echo "msedgedriver failed to start"
            cat "$RUNNER_TEMP/msedgedriver.log" || true
            exit 1
          fi
          echo "== launch app with remote debugging =="
          "target/release/yiyin.exe" &
          app_pid=$!
          echo "$app_pid" > "$RUNNER_TEMP/yiyin.pid"
          debug_ready=false
          for _ in $(seq 1 60); do
            if ! kill -0 "$app_pid" 2>/dev/null; then
              echo "app exited before opening the debugging port"
              break
            fi
            if curl -sf http://127.0.0.1:9222/json/version > /dev/null 2>&1; then
              debug_ready=true
              break
            fi
            sleep 1
          done
          if [ "$debug_ready" != true ]; then
            echo "remote debugging port 9222 never opened"
            exit 1
          fi
          echo "== CDP targets =="
          curl -s http://127.0.0.1:9222/json
          pnpm smoke:w3c -- --application target/release/yiyin.exe --debugger-address 127.0.0.1:9222
      - name: Stop WebDriver smoke processes
        if: always()
        shell: pwsh
        run: |
          foreach ($pidFile in @("msedgedriver.pid", "yiyin.pid")) {
            $pidPath = "$env:RUNNER_TEMP\$pidFile"
            if (Test-Path $pidPath) {
              Stop-Process -Id (Get-Content $pidPath) -Force -ErrorAction SilentlyContinue
            }
          }
          Get-Process -Name msedgedriver, yiyin -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "still running: $($_.Name) ($($_.Id))"
          }
          Stop-Process -Name msedgedriver, yiyin -Force -ErrorAction SilentlyContinue
          if (Test-Path "$env:RUNNER_TEMP\msedgedriver.log") {
            Write-Host "--- $env:RUNNER_TEMP\msedgedriver.log"
            Get-Content "$env:RUNNER_TEMP\msedgedriver.log"
          }
          $diagnosticDirectory = "$env:RUNNER_TEMP\yiyin-app-logs"
          New-Item -ItemType Directory -Force $diagnosticDirectory | Out-Null
          foreach ($logDirectory in @(
            "$env:LOCALAPPDATA\io.github.gaotity.yiyin\logs",
            "$env:APPDATA\io.github.gaotity.yiyin\logs"
          )) {
            if (Test-Path $logDirectory) {
              Copy-Item "$logDirectory\*" $diagnosticDirectory -Recurse -Force
              Get-ChildItem $logDirectory -Recurse -File | ForEach-Object {
                Write-Host "--- $($_.FullName)"
                Get-Content $_.FullName
              }
            }
          }
      - name: Upload Windows smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: yiyin-windows-smoke-diagnostics
          path: |
            ${{ runner.temp }}/msedgedriver.log
            ${{ runner.temp }}/yiyin-app-logs
          if-no-files-found: ignore
          retention-days: 3
      - name: Upload unsigned Windows package
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: yiyin-windows-unsigned
          path: target/release/bundle/nsis
          if-no-files-found: ignore
          retention-days: 7
