name: Native packages

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 24.x
  PNPM_VERSION: 11.13.0
  RUST_TOOLCHAIN: 1.97.0
  CARGO_DENY_VERSION: 0.20.2
  TAURI_DRIVER_VERSION: 2.0.6

jobs:
  macos-package-smoke:
    name: macOS package smoke
    runs-on: macos-15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.13.0 --activate
      - name: Install pinned Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build unsigned package
        run: pnpm tauri build --bundles app,dmg
      - name: Verify package contents
        run: pnpm verify:bundle -- --platform macos --artifact "target/release/bundle/macos/壹印.app"
      - name: Launch smoke
        run: |
          executable="$(find "target/release/bundle/macos/壹印.app/Contents/MacOS" -type f -perm +111 | head -n 1)"
          "$executable" &
          app_pid=$!
          sleep 5
          kill -0 "$app_pid"
          kill "$app_pid"
          wait "$app_pid" || true
      - name: Upload unsigned macOS packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: yiyin-macos-unsigned
          path: |
            target/release/bundle/macos
            target/release/bundle/dmg

  windows-package-and-desktop-smoke:
    name: Windows package and desktop smoke
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.13.0 --activate
      - name: Install pinned Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build unsigned production package
        run: pnpm tauri build --bundles nsis
      - name: Verify production package contents
        run: pnpm verify:bundle -- --platform windows --artifact target/release/bundle
      - name: Install pinned tauri-driver
        shell: bash
        run: cargo install tauri-driver --locked --version "$TAURI_DRIVER_VERSION"
      - name: Build compile-time fixture binary
        run: cargo build -p yiyin-desktop --release --locked --features e2e-fixture
      - name: Prepare one CI fixture
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\yiyin-e2e-fixtures"
          Copy-Item "tests\fixtures\input\portrait-default.png" "$env:RUNNER_TEMP\yiyin-e2e-fixtures\portrait-default.png"
      - name: Desktop W3C smoke
        shell: bash
        env:
          YIYIN_E2E_FIXTURE_DIR: ${{ runner.temp }}\yiyin-e2e-fixtures
        run: |
          echo "== runtime versions =="
          msedgedriver.exe --version || true
          powershell.exe -NoProfile -Command "(Get-Item 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe').VersionInfo.ProductVersion" || true
          powershell.exe -NoProfile -Command "(Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -ErrorAction SilentlyContinue).pv" || true
          echo "== direct launch probe =="
          "target/release/yiyin.exe" &
          probe_pid=$!
          sleep 8
          if kill -0 "$probe_pid" 2>/dev/null; then
            echo "probe: app still running after 8s"
          else
            probe_code=0
            wait "$probe_pid" || probe_code=$?
            echo "probe: app exited early with code $probe_code"
          fi
          taskkill //IM yiyin.exe //F || true
          sleep 2
          echo "== start tauri-driver =="
          edge_driver="$(command -v msedgedriver.exe || command -v msedgedriver)"
          "$HOME/.cargo/bin/tauri-driver.exe" --native-driver "$edge_driver" \
            > "$RUNNER_TEMP/tauri-driver.stdout.log" \
            2> "$RUNNER_TEMP/tauri-driver.stderr.log" &
          driver_pid=$!
          echo "$driver_pid" > "$RUNNER_TEMP/tauri-driver.pid"
          ready=false
          for _ in $(seq 1 60); do
            if ! kill -0 "$driver_pid" 2>/dev/null; then
              echo "tauri-driver exited before becoming ready"
              break
            fi
            if curl -sf http://127.0.0.1:4444/status > /dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo "--- tauri-driver.stdout.log"
            cat "$RUNNER_TEMP/tauri-driver.stdout.log" || true
            echo "--- tauri-driver.stderr.log"
            cat "$RUNNER_TEMP/tauri-driver.stderr.log" || true
            exit 1
          fi
          pnpm smoke:w3c -- --application target/release/yiyin.exe
      - name: Stop tauri-driver
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "$env:RUNNER_TEMP\tauri-driver.pid") {
            Stop-Process -Id (Get-Content "$env:RUNNER_TEMP\tauri-driver.pid") -Force -ErrorAction SilentlyContinue
          }
          Get-Process -Name tauri-driver, msedgedriver, yiyin -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "still running: $($_.Name) ($($_.Id))"
          }
          Stop-Process -Name tauri-driver, msedgedriver, yiyin -Force -ErrorAction SilentlyContinue
          foreach ($path in @(
            "$env:RUNNER_TEMP\tauri-driver.stdout.log",
            "$env:RUNNER_TEMP\tauri-driver.stderr.log"
          )) {
            if (Test-Path $path) {
              Write-Host "--- $path"
              Get-Content $path
            }
          }
          $diagnosticDirectory = "$env:RUNNER_TEMP\yiyin-app-logs"
          New-Item -ItemType Directory -Force $diagnosticDirectory | Out-Null
          foreach ($logDirectory in @(
            "$env:LOCALAPPDATA\io.github.gaotity.yiyin\logs",
            "$env:APPDATA\io.github.gaotity.yiyin\logs"
          )) {
            if (Test-Path $logDirectory) {
              Copy-Item "$logDirectory\*" $diagnosticDirectory -Recurse -Force
              Get-ChildItem $logDirectory -Recurse -File | ForEach-Object {
                Write-Host "--- $($_.FullName)"
                Get-Content $_.FullName
              }
            }
          }
      - name: Upload Windows smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: yiyin-windows-smoke-diagnostics
          path: |
            ${{ runner.temp }}/tauri-driver.stdout.log
            ${{ runner.temp }}/tauri-driver.stderr.log
            ${{ runner.temp }}/yiyin-app-logs
          if-no-files-found: ignore
      - name: Upload unsigned Windows package
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: yiyin-windows-unsigned
          path: target/release/bundle/nsis
          if-no-files-found: ignore
