name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 24.x
  PNPM_VERSION: 11.13.0
  RUST_TOOLCHAIN: 1.97.0
  CARGO_DENY_VERSION: 0.20.2

jobs:
  frontend-quality:
    name: Frontend quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.13.0 --activate
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Type-check
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Browser workflow
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm playwright test
      - name: Production frontend bundle
        run: pnpm build

  rust-quality:
    name: Rust quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Install pinned Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_TOOLCHAIN"
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Architecture boundaries
        run: bash tests/architecture/dependency-boundaries.sh

  security:
    name: Security and supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.13.0 --activate
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Install pinned Rust and cargo-deny
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          cargo install cargo-deny --locked --version "$CARGO_DENY_VERSION"
      - name: Audit npm dependencies
        run: pnpm audit --audit-level high
      - name: Enforce dependency release age
        run: pnpm check:release-age
      - name: Audit Cargo dependencies
        run: cargo deny check
      - name: Security and package policies
        run: pnpm vitest run tests/security/policy.test.ts tests/package/package.test.ts

  golden-compatibility:
    name: Golden rendering compatibility
    runs-on: macos-15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Install pinned Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: Golden rendering test
        run: cargo test -p yiyin-infrastructure --test golden --locked
      - name: Upload perceptual diffs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: golden-rendering-diffs
          path: target/golden-diffs
          if-no-files-found: ignore
